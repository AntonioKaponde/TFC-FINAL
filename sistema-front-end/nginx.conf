server {
    # O Railway injeta a variável PORT dinamicamente; usamos envsubst no Dockerfile
    # para substituir ${PORT} antes de o nginx arrancar.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O backend aceita uploads até 50MB (multipart) — sem isto o nginx
    # rejeita pedidos com 413 acima de 1MB por omissão.
    client_max_body_size 50m;

    # Gzip para melhor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache de assets estáticos (ficheiros com hash do Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy da API para o backend — evita erros 405 e dependência
    # de VITE_API_URL embutida em build-time. O ${API_URL} é substituído
    # pelo entrypoint.sh (envsubst) com a URL do backend.
    # NOTA: API_URL deve ficar SEM barra final (ex.: https://api.exemplo.com)
    # para o caminho /api/... ser preservado tal como está.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA routing — todas as rotas devolvem index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon e manifest
    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /manifest.json {
        expires 30d;
        access_log off;
    }
}
