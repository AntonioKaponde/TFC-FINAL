server {
    # O Railway injeta a variável PORT dinamicamente; usamos envsubst no Dockerfile
    # para substituir ${PORT} antes de o nginx arrancar.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para melhor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache de assets estáticos (ficheiros com hash do Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — todas as rotas devolvem index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon e manifest
    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /manifest.json {
        expires 30d;
        access_log off;
    }
}
