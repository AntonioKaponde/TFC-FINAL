spring:
  application:
    name: sistema-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    # Credenciais por variáveis de ambiente (evita segredos no repositório).
    # Os valores por omissão servem apenas para o desenvolvimento local.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/facturacao
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:rooter}
    password: ${MYSQL_PASSWORD:Root@2024}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
