spring:
  application:
    name: sistema-api
  datasource:
    # O Railway injeta PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD quando um
    # serviço PostgreSQL está ligado. Isto evita o problema do DATABASE_URL
    # vir sem o prefixo "jdbc:" que o Hikari exige.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
