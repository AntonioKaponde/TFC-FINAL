spring:
  application:
    name: sistema-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sistema}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${FRONTEND_URL}
